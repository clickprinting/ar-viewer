<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        // 1. قراءة رقم الآيدي من الرابط
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id'); // مثلاً ?id=105

        if (!id) {
          alert("الرجاء التأكد من مسح الكود بشكل صحيح (رقم التصميم مفقود)");
          return;
        }

        // 2. تحديد مسار الملفات بناءً على الرقم
        const mindFile = `./assets/${id}.mind`;
        const videoFile = `./assets/${id}.mp4`;

        // 3. تحديث الكود ليشغل الملفات المطلوبة
        const scene = document.querySelector('a-scene');
        const videoAsset = document.querySelector('#vid');
        
        // إعداد نظام التتبع بالصورة
        scene.setAttribute('mindar-image', `imageTargetSrc: ${mindFile}; filterMinCF:0.0001; filterBeta: 0.001;`);
        
        // وضع الفيديو المناسب
        videoAsset.setAttribute('src', videoFile);
        
        // تشغيل الفيديو عند اكتشاف الصورة
        const target = document.querySelector('[mindar-image-target]');
        target.addEventListener("targetFound", event => {
          console.log("تم اكتشاف التيشرت!");
          videoAsset.play();
        });
        target.addEventListener("targetLost", event => {
          console.log("اختفى التيشرت");
          videoAsset.pause();
        });
      });
    </script>
  </head>
  <body>
    <a-scene mindar-image color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="vid" src="" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid" position="0 0 0" height="1" width="1" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
